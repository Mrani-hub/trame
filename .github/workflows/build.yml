# Compile Trame dans le cloud GitHub — aucun SDK à installer sur votre PC.
# Android : APK de test à chaque envoi ; APK signé si les secrets ANDROID_* sont renseignés.
# Étiquette vX.Y.Z : publication d'une « Release » avec Trame.apk (lien utilisé par la mise à jour intégrée).
# iOS : vérification que le projet compile (l'envoi TestFlight viendra avec le compte Apple Developer).
name: Compiler Trame

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_KEY: ${{ secrets.TRAME_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dépendances, tests et appli web
        run: |
          npm ci
          npm test
          npm run build:web
          npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # le paquet « tools » (installé par défaut) n'existe plus : on liste les paquets utiles
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Version
        run: |
          echo "TRAME_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "TRAME_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      # Clé permanente : fichier chiffré dans android/signing/, déchiffré avec le secret TRAME_SIGNING_KEY.
      - name: Clé de signature (fichier chiffré du dépôt)
        if: env.SIGNING_KEY != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/signing/trame-release.jks.enc \
            -out "$RUNNER_TEMP/trame-release.jks" -pass env:SIGNING_KEY
          {
            echo "TRAME_KEYSTORE_PATH=$RUNNER_TEMP/trame-release.jks"
            echo "TRAME_KEYSTORE_PASSWORD=$SIGNING_KEY"
            echo "TRAME_KEY_ALIAS=trame"
            echo "TRAME_KEY_PASSWORD=$SIGNING_KEY"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$SIGNING_KEY"
      - name: Clé de signature (secrets ANDROID_*)
        if: env.SIGNING_KEY == '' && env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/trame-release.jks"
          {
            echo "TRAME_KEYSTORE_PATH=$RUNNER_TEMP/trame-release.jks"
            echo "TRAME_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "TRAME_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "TRAME_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - name: Compiler
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$TRAME_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Trame.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Trame.apk
          fi
      - name: APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Trame-${{ env.TRAME_VERSION_NAME }}-${{ github.run_number }}
          path: Trame.apk
          if-no-files-found: error
      - name: Bundle Play Store (.aab)
        if: env.TRAME_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: Trame-${{ env.TRAME_VERSION_NAME }}-playstore
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Trame.apk
          generate_release_notes: true

  ios:
    name: iOS (vérification)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Appli web
        run: |
          npm ci
          npm run build:web
          npx cap sync ios
      - name: Compiler (simulateur, sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
